[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "text-to-sql-engine"
version = "0.1.0"
description = "Production-ready Text-to-SQL engine with deterministic safety, authorization, and observability."
readme = "README.md"
# NOTE: The reference/target production runtime is Python 3.12+. We declare >=3.10
# so the project remains runnable and testable on common developer machines and CI
# images that still ship 3.10/3.11. The code intentionally avoids 3.12-only syntax
# (PEP 695 generics / `type` aliases) and uses `from __future__ import annotations`.
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Text-to-SQL Engine Authors" }]
keywords = ["text-to-sql", "llm", "nl2sql", "fastapi", "sqlglot"]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "sqlglot>=23.0",
    "httpx>=0.27",
    "alembic>=1.13",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "bandit>=1.7",
]
# Optional heavier observability stack. The core ships a lightweight, dependency-free
# equivalent (Prometheus text exposition + OTel-shaped spans) so these are not required.
otel = [
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp>=1.25",
]
load = ["locust>=2.25"]

[project.scripts]
text-to-sql = "text_to_sql.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/text_to_sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests that touch a real database engine",
    "e2e: full HTTP-to-database end-to-end tests",
    "security: adversarial and security-focused tests",
    "property: Hypothesis property-based tests",
    "contract: API contract tests",
    "golden: golden evaluation suite",
    "performance: performance / reliability tests",
    "postgres: requires a running PostgreSQL instance (opt-in)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
branch = true
source = ["src/text_to_sql"]
omit = ["src/text_to_sql/main.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "PTH", "RUF"]
ignore = [
    "B008",   # FastAPI dependency-injection uses function calls in defaults by design
    "UP007",  # keep Optional/Union readable across 3.10+
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "S101"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
ignore_missing_imports = true
files = ["src/text_to_sql"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
# Rationale for each skip (see docs/security/):
#  B101 - asserts are not used for control flow in production paths.
#  B104 - binding 0.0.0.0 is intentional for containerized deployment.
#  B311 - `random` is used ONLY to generate deterministic synthetic seed data,
#         never for security. Cryptographic randomness is not required.
#  B608 - SQL is *constructed* by the fake provider (an LLM stand-in) and by the
#         EXPLAIN wrapper, then ALWAYS parsed + AST-validated + policy-checked +
#         tenant-rewritten before execution. Bandit's string-concatenation
#         heuristic does not model that deterministic gate; the AST validator is
#         the real control. See docs/security/sql_injection_threat_model.md.
skips = ["B101", "B104", "B311", "B608"]
