name: Live Provider Evaluation

# Optional, manually-triggered workflow that runs the golden evaluation harness
# against a REAL OpenAI-compatible provider. It requires the OPENAI_API_KEY
# secret and is never part of standard CI (which uses the deterministic fake).
# Use it to measure a specific model/prompt version against the golden dataset.

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model id to evaluate"
        required: true
        default: "gpt-4o-mini"

jobs:
  live-eval:
    runs-on: ubuntu-latest
    if: ${{ secrets.OPENAI_API_KEY != '' }}
    env:
      T2SQL_LLM_PROVIDER: openai
      T2SQL_LLM_MODEL: ${{ github.event.inputs.model }}
      T2SQL_LLM_API_KEY_ENV: OPENAI_API_KEY
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Run golden evaluation against the live provider
        run: python -m tests.golden.run_eval
      - name: Upload evaluation reports
        uses: actions/upload-artifact@v4
        with:
          name: live-eval-results
          path: eval_results/
