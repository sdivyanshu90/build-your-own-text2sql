name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI never needs paid LLM credentials — the deterministic fake provider is used.
  T2SQL_LLM_PROVIDER: fake
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # ---------------------------------------------------------------------------
  # Fast quality gates: format, lint, types, security scan, unit + property +
  # security + contract + golden tests (SQLite only — no services needed).
  # ---------------------------------------------------------------------------
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff format check
        run: ruff format --check src tests

      - name: Ruff lint
        run: ruff check src tests

      - name: mypy
        run: mypy src

      - name: Bandit security scan
        run: bandit -q -r src -c pyproject.toml

      - name: Dependency vulnerability scan
        run: |
          pip install pip-audit
          pip-audit --strict --progress-spinner off || true  # advisory; do not block CI

      - name: Unit / security / property / contract / golden tests
        run: >
          pytest -m "unit or security or property or contract or golden"
          --cov=text_to_sql --cov-report=xml --cov-report=term-missing
          --cov-fail-under=90

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  # ---------------------------------------------------------------------------
  # Integration + e2e + migrations against a real PostgreSQL service.
  # ---------------------------------------------------------------------------
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: t2sql
          POSTGRES_PASSWORD: t2sql
          POSTGRES_DB: t2sql
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U t2sql -d t2sql"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      # Postgres for integration; app still uses the fake LLM provider.
      T2SQL_DATABASE_URL: postgresql+psycopg://t2sql:t2sql@localhost:5432/t2sql
      T2SQL_SQL_DIALECT: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (with postgres driver)
        run: pip install -e ".[dev,postgres]"

      - name: Run migrations
        run: alembic upgrade head

      - name: Seed database
        run: python scripts/seed.py

      - name: Integration + e2e + performance tests
        run: pytest -m "integration or e2e or performance" -p no:cacheprovider

      - name: Golden evaluation (baseline metrics)
        run: python -m tests.golden.run_eval

      - name: Application startup smoke test
        run: |
          python -c "from text_to_sql.api.app import create_app; create_app(); print('app OK')"

  # ---------------------------------------------------------------------------
  # Build the production container image.
  # ---------------------------------------------------------------------------
  docker:
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t text-to-sql-engine:ci .
